      var THEME_KEY = "zygrafi-semantic-theme-" + (data.slug || "default");
      var selectedNodeId = null;
      var currentRoomIndex = 0;
      var currentGraph = { nodes: [], edges: [] };
      var sigmaInstance = null;
      function escapeHTML(s){ return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
      function isDarkColor(hex){ if(!/^#([0-9a-fA-F]{6})$/.test(hex)) return false; var r=parseInt(hex.substr(1,2),16), g=parseInt(hex.substr(3,2),16), b=parseInt(hex.substr(5,2),16); var br=(r*299+g*587+b*114)/1000; return br<128; }
      function applyTheme(t){ document.documentElement.setAttribute("data-theme", t); localStorage.setItem(THEME_KEY, t); themeBtn.textContent = "Tema: " + (t === "dark" ? "Oscuro" : "Claro"); }
      function currentTheme(){ return document.documentElement.getAttribute("data-theme") || "light"; }
      function inlineFormat(s){ s = escapeHTML(String(s == null ? "" : s)); s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); s = s.replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, "$1<em>$2</em>"); return s; }
      function formatRichText(s){ s = String(s || "").replace(/\\n/g, "\n").replace(/\r\n/g, "\n"); var blocks = s.split(/\n{2,}/); return blocks.map(function(block){ var lines = block.split("\n"); var isList = lines.length > 0 && lines.every(function(line){ return /^\s*[-*]\s+/.test(line); }); if (isList) { return "<ul>" + lines.map(function(line){ return "<li>" + inlineFormat(line.replace(/^\s*[-*]\s+/, "")) + "</li>"; }).join("") + "</ul>"; } return "<p>" + lines.map(inlineFormat).join("<br>") + "</p>"; }).join("") || "<p>(sin descripción)</p>"; }
      function setPanel(title, body, color){ var badgeColor = color || "#8C92AC"; navTitle.textContent = title || "Museo personal"; navTitle.style.backgroundColor = badgeColor; navTitle.style.color = isDarkColor(badgeColor) ? "#fff" : "#111"; navContent.innerHTML = body || "<p>(sin contenido)</p>"; }
      function showAll(){ var room = rooms[currentRoomIndex] || {}; var allColor = (room.topicColorMap && (room.topicColorMap.todos || room.topicColorMap.entry)) || "#8C92AC"; setPanel(allData.title || data.title || "Museo personal", formatRichText(allData.description || ""), allColor); }
      function showRoom(index){ var room = rooms[index] || {}; var meta = roomMeta[room.alias] || {}; var color = room.background || "#8C92AC"; var title = meta.title || room.alias || ("Sala " + (index + 1)); var desc = meta.description || ("Sala seleccionada con " + ((room.nodes || []).length) + " nodos."); setPanel(title, formatRichText(desc), color); }
      function showTopic(topic){ var room = rooms[currentRoomIndex] || {}; var topicData = entryTopic[topic] || { title: topic, description: "" }; var color = (room.topicColorMap && room.topicColorMap[topic]) || "#8C92AC"; setPanel(topicData.title || topic, formatRichText(topicData.description || ""), color); }
      function showNode(nodeId){ selectedNodeId = nodeId; var room = rooms[currentRoomIndex] || {}; var nodeData = entryData[nodeId] || { title: nodeId, text: "" }; var nodeInfo = (currentGraph.nodes || []).find(function(n){ return n.id === nodeId; }) || {}; var color = nodeInfo.color || ((room.topicColorMap && room.topicColorMap[nodeInfo.category]) || "#8C92AC"); var currentTopic = topicSelect.value || "__ALL__"; var extraMap = nodeData.extraByTopic || {}; var extraText = ""; if (currentTopic === "__ALL__") { extraText = extraMap.todos || extraMap.Todo || extraMap.todo || extraMap.All || extraMap.all || ""; } else { extraText = extraMap[currentTopic] || ""; } var html = formatRichText(nodeData.text || ""); if (extraText) { html += '<hr style="margin:12px 0;border:none;border-top:1px solid #ccc;">'; html += formatRichText(extraText); } if (nodeData.image && nodeData.image !== "undefined") { html += '<img class="resp" src="' + escapeHTML(nodeData.image) + '" alt="' + escapeHTML(nodeData.title || nodeId) + '">'; } setPanel(nodeData.title || nodeId, html, color); }
      function populateTopicSelect(room){ var categories = Array.from(new Set((room.nodes || []).map(function(n){ return n.category || "entry"; }))).filter(function(cat){ return cat !== "entry" && cat !== "todos"; }).sort(); topicSelect.innerHTML = ""; var allOpt = document.createElement("option"); allOpt.value = "__ALL__"; allOpt.textContent = "Todos"; topicSelect.appendChild(allOpt); categories.forEach(function(cat){ var opt = document.createElement("option"); opt.value = cat; opt.textContent = cat; topicSelect.appendChild(opt); }); topicSelect.value = "__ALL__"; }
      function filteredGraph(room, topic){ if (!topic || topic === "__ALL__") return { nodes: room.nodes || [], edges: room.edges || [] }; var keep = new Set(); (room.nodes || []).forEach(function(n){ if (n.category === topic) keep.add(n.id); }); (room.edges || []).forEach(function(e){ var sourceNode = (room.nodes || []).find(function(n){ return n.id === e.source; }); var targetNode = (room.nodes || []).find(function(n){ return n.id === e.target; }); if ((sourceNode && sourceNode.category === topic) || (targetNode && targetNode.category === topic)) { keep.add(e.source); keep.add(e.target); } }); return { nodes: (room.nodes || []).filter(function(n){ return keep.has(n.id); }), edges: (room.edges || []).filter(function(e){ return keep.has(e.source) && keep.has(e.target); }) }; }
      function renderGraph(graphData, background){ currentGraph = graphData; graphEl.innerHTML = ""; graphEl.style.background = background || "var(--bg)"; var updated = { nodes: (graphData.nodes || []).map(function(n){ var out = {}; for (var k in n) out[k] = n[k]; out.color = (selectedNodeId && n.id === selectedNodeId) ? "#bbbbbb" : n.color; return out; }), edges: graphData.edges || [] }; sigmaInstance = new sigma({ graph: updated, container: graphEl }); sigmaInstance.camera.goTo({ x: 0, y: 0, ratio: 1.4 }); sigmaInstance.settings({ labelSize:"fixed", defaultLabelSize:14, defaultLabelColor:"#000", labelColor:"node", defaultLabelFont:"sans-serif" }); sigma.canvas.labels.def = function(node, ctx, settings){ var p = settings("prefix") || ""; var size = node.labelSize || settings("defaultLabelSize"); var font = node.font || settings("defaultLabelFont"); ctx.font = size + "px " + font; ctx.fillStyle = node.labelColor || settings("defaultLabelColor"); ctx.textAlign = "center"; ctx.fillText(node.label, node[p + "x"], node[p + "y"] + size + 2); }; sigmaInstance.bind("clickNode", function(e){ showNode(e.data.node.id); renderGraph(filteredGraph(rooms[currentRoomIndex], topicSelect.value), rooms[currentRoomIndex].background); }); }
      function loadRoom(index){ currentRoomIndex = index; selectedNodeId = null; var room = rooms[index] || { nodes: [], edges: [], background: "#ffffff" }; populateTopicSelect(room); renderGraph(filteredGraph(room, "__ALL__"), room.background); showRoom(index); }
      topicSelect.addEventListener("change", function(){ selectedNodeId = null; var room = rooms[currentRoomIndex] || { nodes: [], edges: [] }; renderGraph(filteredGraph(room, topicSelect.value), room.background); if (topicSelect.value === "__ALL__") showAll(); else showTopic(topicSelect.value); });
      roomSelect.addEventListener("change", function(){ loadRoom(Number(roomSelect.value) || 0); });
      themeBtn.addEventListener("click", function(){ applyTheme(currentTheme() === "light" ? "dark" : "light"); });
      rooms.forEach(function(room, idx){ var opt = document.createElement("option"); opt.value = String(idx); opt.textContent = room.alias || ("Sala " + (idx + 1)); roomSelect.appendChild(opt); });
      var saved = localStorage.getItem(THEME_KEY); applyTheme(saved || "light"); roomSelect.value = String(data.defaultRoomIndex || 0); loadRoom(data.defaultRoomIndex || 0);
    })();
  </script>
